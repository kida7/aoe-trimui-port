# Age of Empires on TrimUI: controller mapping (INI)
#
# [gamepad]  pad button = key / mouse action, written to a gptokeyb config at every launch.
#            buttons : a b x y l1 l2 l3 r1 r2 r3 start back(=select) up down left right
#                      a b x y are the labels PRINTED ON THE DEVICE (A right, B bottom, X top, Y left); launch.sh
#                      swaps them for gptokeyb, whose SDL naming is the other way round on this pad.
#                      left_analog_{up,down,left,right} right_analog_{up,down,left,right}
#            values  : any key name gptokeyb knows (esc enter space tab h 1 2 f1..f12 up down left right
#                      a..z 0..9 ctrl alt shift ...) or  mouse_left mouse_right mouse_middle
#                      mouse_slow mouse_fast mouse_movement_{up,down,left,right}
#            Leave a button out to leave it unmapped. R3/L3 are unmapped on purpose (keyboard toggle below).
# [gptokeyb] tuning (dead zone, mouse speed), passed through unchanged.
# [osk]      on-screen keyboard (xmirror): which pad button does what.
#            value = button[+button...][, alternative...]   e.g.  toggle = menu   or   toggle = l1+r1, r3
#            If the toggle button is also mapped in [gamepad], launch.sh logs a warning to /tmp/aoe-controls.log.

[gamepad]
# select + start together = quit the game (handled by xmirror, not by this mapping).
back = f11
start = enter

# a, b, y are the letter keys A, B, Y
a = a
b = b
x = h
y = y

l1 = ctrl
r1 = l
r2 = mouse_left
l2 = mouse_right

# d-pad: up E, down S, left G, right L
up = e
down = s
left = g
right = l

# left stick = mouse pointer, right stick = the keyboard arrow keys (the d-pad is E S G L)
left_analog_up = mouse_movement_up
left_analog_down = mouse_movement_down
left_analog_left = mouse_movement_left
left_analog_right = mouse_movement_right

right_analog_up = up
right_analog_down = down
right_analog_left = left
right_analog_right = right

[gptokeyb]
deadzone_mode = scaled_radial
deadzone = 2000
deadzone_scale = 8
deadzone_delay = 16
mouse_scale = 6144
mouse_delay = 12

[display]
# Mouse cursor drawn by xmirror on top of the game picture.
#   real  = the cursor the game sets on X (menus: the arrow; in a match AoE hides it and draws its own, so only one cursor shows)
#   arrow = always draw the built-in arrow (shows a second cursor in a match)
#   none  = never draw one
cursor = real
cursor_scale = 2

[osk]
# While the keyboard is open the d-pad / left stick move the highlight and gptokeyb is paused.
toggle = menu
type = a
backspace = b
space = x
shift = y
enter = start
close = select, l3
